<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Box</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1><span>■</span> Red Box</h1><p>Tu red, en un solo lugar</p></header><nav aria-label="Secciones"><button data-tab="home">Inicio</button><button data-tab="devices">Dispositivos</button><button data-tab="events">Eventos</button><button data-tab="settings">Configuración</button></nav><main><p id="error" role="alert"></p><section id="home"><h2>Estado de la red</h2><div id="summary" class="cards"></div><h2>Últimos eventos</h2><div id="recent"></div></section><section id="devices" hidden><h2>Dispositivos</h2><p>Alias, categoría y crítico se guardan solo en Red Box.</p><div id="device-list"></div></section><section id="events" hidden><h2>Eventos</h2><div id="event-list"></div></section><section id="settings" hidden><h2>Configuración</h2><article><h3>Telegram</h3><p id="telegram-status"></p><button id="test">Enviar mensaje de prueba</button><p id="test-result" role="status"></p><form id="settings-form"><label>Cooldown (segundos)<input id="cooldown" type="number" min="1" max="86400" required></label><button>Guardar</button></form><p>Las alertas automáticas se habilitan después de una prueba exitosa. Credenciales en el archivo .env del servidor.</p></article></section></main><script src="/app.js" type="module"></script></body></html>
